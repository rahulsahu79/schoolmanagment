{% extends "Home/base.html" %}
{% load static %}
{% block body %}

        <div class="page-wrapper">
        <div class="content container-fluid">

        <div class="page-header">
        <div class="row align-items-center">
        <div class="col">
        <h3 class="page-title">Edit Teachers</h3>
        <ul class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url "teacher_list" %}">Teachers</a></li>
        <li class="breadcrumb-item active">Edit Teachers</li>
        </ul>
        </div>
        </div>
        </div>

        <div class="row">
        <div class="col-sm-12">
        <div class="card">
        <div class="card-body">
        <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
        <div class="col-12">
        <h5 class="form-title"><span>Basic Details</span></h5>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Teacher ID</label>
        <input type="hidden" class="form-control" value="{{teacher_edit.teacher_id}} " name="teacher_id" readonly >
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" value="{{teacher_edit.name}}" name="name">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Gender</label>
        <select class="form-control" name="gender">
        <option value="Male" {% if teacher_edit.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if teacher_edit.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Others" {% if teacher_edit.gender == "Other" %}selected{% endif %}>Others</option>
        </select>
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" class="form-control" value="{{teacher_edit.date_of_birth | date:'Y-m-d'}}" name="date_of_birth">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Mobile</label>
        <input type="text" class="form-control" value="{{teacher_edit.mobile}}" name="mobile">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Joining Date</label>
        <input type="date" class="form-control" value="{{teacher_edit.joining_date | date:'Y-m-d'}} " name="joining_date">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Qualification</label>
        <input class="form-control" type="text" value="{{teacher_edit.qualification}}" name="qualification">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Experience</label>
        <input class="form-control" type="text" value="{{teacher_edit.exprience}}" name="exprience">
        </div>
        </div>
       
        <div class="col-12">
        <h5 class="form-title"><span>Address</span></h5>
        </div>
        <div class="col-12">
        <div class="form-group">
        <label>Address</label>
        <input type="text" class="form-control" value="{{teacher_edit.address}}" name="address">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>City</label>
        <input type="text" class="form-control" value="{{teacher_edit.city}}" name="city">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>State</label>
        <input type="text" class="form-control" value="{{teacher_edit.state}}" name="state">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Zip Code</label>
        <input type="text" class="form-control" value="{{teacher_edit.zip_code}}" name="zip_code">
        </div>
        </div>
        <div class="col-12 col-sm-6">
        <div class="form-group">
        <label>Country</label>
        <input type="text" class="form-control" value="{{teacher_edit.country}}" name="country">
        </div>
        </div>
        <div class="col-12">
        <button type="submit" class="btn btn-primary">Submit</button>
        </div>
        </div>
        </form>
        </div>
        </div>
        </div>
        </div>
        </div>
        </div>

        </div>


        <script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>

        <script src="{% static 'assets/js/popper.min.js'%}"></script>
        <script src="{% static 'assets/plugins/bootstrap/js/bootstrap.min.js' %}"></script>

        <script src="{% static 'assets/plugins/slimscroll/jquery.slimscroll.min.js' %}"></script>

        <script src="{% static 'assets/js/script.js' %}"></script>
        </body>

        <!-- Mirrored from preschool.dreamguystech.com/html-template/edit-teacher.html by HTTrack Website Copier/3.x [XR&CO'2014], Thu, 28 Oct 2021 11:11:50 GMT -->
        </html>

{% endblock %}
